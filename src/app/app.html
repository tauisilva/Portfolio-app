<!-- Soft Ambient Background Glows (Stitch Design System) -->
<div class="pointer-events-none fixed inset-0 z-0 overflow-hidden opacity-30">
  <div class="absolute -top-40 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[140px]"></div>
  <div class="absolute top-1/3 -right-20 w-120 h-120 bg-secondary/10 rounded-full blur-[150px]"></div>
  <div class="absolute bottom-10 left-1/3 w-80 h-80 bg-tertiary/10 rounded-full blur-[140px]"></div>
</div>

<!-- Header / Navigation Bar -->
<app-navbar />

<!-- Main Content Area -->
<main class="relative z-10 w-full pt-20 max-w-container-max mx-auto px-gutter-desktop min-h-[calc(100vh-16rem)]">
  <div class="flex flex-col w-full">
    <!-- Hero Section -->
    <app-hero />

    <!-- About Section (Deferrable View) -->
    @defer (on viewport) {
      <app-about />
    } @placeholder {
      <div class="min-h-96 py-space-2xl"></div>
    }

    <!-- Projects Section (Deferrable View) -->
    @defer (on viewport) {
      <app-projects />
    } @placeholder {
      <div class="min-h-96 py-space-2xl"></div>
    }

    <!-- Featured DEV.to Article Banner (Deferrable View) -->
    @defer (on viewport) {
      <app-articles />
    } @placeholder {
      <div class="min-h-48 py-space-xl"></div>
    }

    <!-- Tech Stack Matrix (Deferrable View) -->
    @defer (on viewport) {
      <app-tech-stack />
    } @placeholder {
      <div class="min-h-96 py-space-2xl"></div>
    }

    <!-- Contact Hub (Deferrable View) -->
    @defer (on viewport) {
      <app-contact />
    } @placeholder {
      <div class="min-h-96 py-space-2xl"></div>
    }
  </div>
</main>

<!-- Footer -->
<app-footer />
